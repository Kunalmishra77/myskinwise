name: CI

# Fast, secret-free static checks. The heavy jobs that used to live here
# (build, Playwright e2e, axe a11y, Lighthouse) need a running server + runtime
# secrets that aren't available in GitHub Actions, so they failed on every push
# and spammed failure emails. Vercel already builds + validates on every deploy,
# so those are covered there — CI here stays green and useful.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test
