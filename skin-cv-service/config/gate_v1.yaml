# Capture-quality gate thresholds (blueprint §4.1).
#
# PHILOSOPHY (v0.6.0): the ON-CAMERA client already validates framing, distance,
# pose, lighting, sharpness and stability, and captures a cropped, verified,
# stable frame. So this server gate is a light SANITY check, not a strict
# rejector — its job is to reject only genuinely un-analysable images (no face /
# multiple faces / extreme problems), never to send a user who did everything
# right back to the camera. Thresholds are deliberately WIDE. Real population
# calibration (Phase B) can tighten them later once we have data; until then,
# "a real face always goes through" beats "perfect quality".

face:
  # MediaPipe FaceMesh detection confidence, and exactly one face in frame.
  min_detection_confidence: 0.5
  max_faces: 1

blur:
  # Variance of the Laplacian on the L channel (0..255). Low = blurry. Kept very
  # low: the client already rejects soft frames before capture, so this only
  # catches a catastrophically smeared image.
  min_variance: 5.0

exposure:
  # Mean L* (0..100) over the face skin region. Wide band — accepts dim indoor
  # light through to bright daylight.
  min_mean_l: 12.0
  max_mean_l: 96.0

clipping:
  # Percentage of skin pixels with ANY channel blown out. Generous.
  channel_value: 252
  max_percent: 25.0

pose:
  # Head orientation (deg) via solvePnP on a generic 3D model, which carries a
  # large systematic bias (~10-20°). Bounds are wide so an ordinary phone selfie
  # is never rejected as "not straight"; only a true side profile fails.
  max_yaw_deg: 45.0
  max_pitch_deg: 45.0
  max_roll_deg: 35.0

distance:
  # Interpupillary distance in px. Very wide — the client already frames the
  # face, so this only rejects a face that's a tiny speck or fills the whole frame.
  min_ipd_px: 40.0
  max_ipd_px: 600.0

lighting_evenness:
  # Left-cheek vs right-cheek mean-L* difference. Wide — ordinary room lighting
  # (one side nearer a window) passes; only harsh single-side lighting fails.
  max_delta_l: 45.0

# Most-severe-first. On failure the gate reports the FIRST failing check in this
# order, so the user sees one actionable instruction, not a wall of errors.
priority:
  - MEASUREMENT_ERROR
  - NO_FACE
  - MULTIPLE_FACES
  - BLUR_TOO_HIGH
  - TOO_DARK
  - TOO_BRIGHT
  - CLIPPING
  - POSE_YAW
  - POSE_PITCH
  - POSE_ROLL
  - TOO_FAR
  - TOO_CLOSE
  - UNEVEN_LIGHTING

# One clear, non-technical instruction per reason code.
messages:
  MEASUREMENT_ERROR: "We couldn't read that photo properly — please try again."
  NO_FACE: "Move your face into the circle."
  MULTIPLE_FACES: "Make sure only your face is in the photo."
  BLUR_TOO_HIGH: "Photo is blurry — hold your phone steady and try again."
  TOO_DARK: "It's too dark — face a window or turn on a light."
  TOO_BRIGHT: "It's too bright — move out of direct light."
  CLIPPING: "Move away from direct light — parts of your face are washed out."
  POSE_YAW: "Look straight at the camera."
  POSE_PITCH: "Keep your head level — not tilted up or down."
  POSE_ROLL: "Straighten your head."
  TOO_FAR: "Come a little closer."
  TOO_CLOSE: "Move back a little."
  UNEVEN_LIGHTING: "The light is uneven — face a window so it's even on both sides."
